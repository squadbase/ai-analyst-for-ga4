version: '1'

# Build Settings
build:
  framework: nextjs        # streamlit | nextjs | morph
  runtime: node22          # python3.9, python3.10, python3.11, python3.12, node18, node20, node22
  package_manager: npm        # pip, poetry, uv, npm, yarn, pnpm
  entrypoint: dist/index.html      # src/app.py

# Deployment Settings
deployment:
  provider: gcp
  aws:
    memory: 512
    timeout: 30
    provisioned_concurrency: 0
    ephemeral_storage: 512
  gcp:
    memory: 1Gi
    cpu: 1
    timeout: 300
    concurrency: 80
    min_instances: 0
    ephemeral_storage: 10Gi
